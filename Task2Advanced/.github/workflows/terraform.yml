name: terraform-cicd

# CI/CD инфраструктуры: init -> plan -> apply (по кнопке с approval).
# Состояние — только в S3-backend (локально не хранится), креды — в Secrets.

on:
  pull_request:
    paths:
      - "Task2Advanced/**"
  workflow_dispatch: {}   # ручной запуск apply

permissions:
  contents: read
  pull-requests: write    # чтобы опубликовать план комментарием в PR

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  WORKING_DIR: Task2Advanced

jobs:
  plan:
    name: terraform plan (проверка PR)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: terraform init (S3 backend)
        run: terraform init -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_AWS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_AWS_SECRET }}

      - name: terraform plan
        run: terraform plan -input=false -no-color -lock-timeout=120s
        env:
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          TF_VAR_subnet_id: ${{ secrets.YC_SUBNET_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_AWS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_AWS_SECRET }}

  apply:
    name: terraform apply (по кнопке, требует approval)
    needs: plan
    if: github.event_name == 'workflow_dispatch'
    # Environment с required reviewers: Settings -> Environments -> production
    environment: production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: terraform init (S3 backend)
        run: terraform init -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_AWS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_AWS_SECRET }}

      - name: terraform plan (артефакт для аудита)
        run: terraform plan -input=false -no-color -out=tfplan

      - name: terraform apply
        run: terraform apply -input=false -auto-approve tfplan
        env:
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          TF_VAR_subnet_id: ${{ secrets.YC_SUBNET_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_AWS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_AWS_SECRET }}
